plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'idea'
}

group = mod_group_id
version = "${mod_version}-fabric-mc${minecraft_version}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }

    maven {
        name = 'Parchment'
        url = 'https://maven.parchmentmc.org'
    }
}

loom {
    runs {
        client {
            client()
            runDir 'run/client'
        }

        server {
            server()
            runDir 'run/server'
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory = file('src/generated/resources')
    }
}

tasks.register('runServerData') {
    group = 'Fabric'
    description = 'Runs Fabric data generation.'
    dependsOn tasks.named('runDatagen')
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${modmenu_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            loader_version         : loader_version,
            loader_version_range   : loader_version_range,
            fabric_api_version     : fabric_api_version,
            fabric_api_version_range: fabric_api_version_range,
            modmenu_version        : modmenu_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('runDuplicateTradeRuleTests', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.artemis.commontrades.trade.DuplicateTradeRulesTest'
}

tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn tasks.named('runDuplicateTradeRuleTests')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
