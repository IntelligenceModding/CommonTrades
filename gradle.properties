# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=26.3
# Include all 26.3 patches without claiming compatibility with the next game drop.
minecraft_version_range=>=26.3 <26.4

# Fabric
loom_version=1.18.2
loader_version=0.20.1
# Minimum required by the 26.3 Fabric API; allow newer Loader releases.
loader_version_range=0.19.3
fabric_api_version=0.165.0+26.3
# First Fabric API for the final 26.3 release; allow newer API releases.
fabric_api_version_range=0.160.5
modmenu_version=21.0.0

# Mod properties
mod_id=commontrades
mod_name=Common Trades
mod_license=MIT License
mod_version=1.0.0
mod_group_id=de.artemis.commontrades
mod_authors=DoomedArtemis
mod_description=Automatically adds suitable modded items to Wandering Trader trades for seamless modpack integration.
