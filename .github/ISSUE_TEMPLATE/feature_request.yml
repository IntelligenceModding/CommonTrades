name: Feature Request
description: Suggest a new feature or improvement for Common Trades
title: "[Feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Common Trades.

        Please describe the idea clearly and explain how it would improve the project.

  - type: textarea
    id: feature
    attributes:
      label: Feature
      description: What would you like to see added or changed?
      placeholder: Describe the trade category, tag support, config option, visual marker improvement, compatibility improvement, documentation change, or other feature.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Explain what this would improve or what use case it would support.
      placeholder: Explain why this feature would be useful.
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Area
      description: Which part of Common Trades would this request affect?
      options:
        - Wandering Trader Offer Generation
        - Trade Discovery / Tags
        - Datapacks
        - Server Config
        - Client Config
        - Blacklists
        - Generated Offer Prices / Counts
        - Duplicate Trade Filtering
        - Visual Markers / Tooltips
        - Client-Server Sync
        - Debug Command
        - Compatibility
        - Documentation
        - Other
        - Not sure
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Suggested Behavior or Design
      description: Explain how you imagine the feature working or looking.
      placeholder: Describe your suggested implementation, workflow, interface, config, tag behavior, or trade behavior.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Add screenshots, mockups, examples, links, datapack snippets, modpack examples, or other references if useful.

  - type: input
    id: version
    attributes:
      label: Relevant Minecraft Version
      description: If this request relates to a specific Minecraft version, enter it here.
      placeholder: "Example: 1.21.5 or N/A"

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and did not find the same suggestion.
          required: true
        - label: This request is related to Common Trades and fits the general purpose of the project.
          required: true
