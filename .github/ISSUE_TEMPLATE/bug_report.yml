name: Bug Report
description: Report a reproducible problem with Common Trades
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem with Common Trades.

        Please provide enough information for the issue to be reproduced and investigated.

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      placeholder: "Example: 1.21.1"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Common Trades Version
      placeholder: "Example: 0.1.0"
    validations:
      required: true

  - type: input
    id: loader
    attributes:
      label: Mod Loader
      placeholder: "Example: NeoForge 21.1.226"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Explain what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Explain what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Launch the game with ...
        2. ...
        3. The issue occurs.
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other Installed Mods
      placeholder: |
        Example:
        - JEI 19.22.0.315
        - Example Mod 1.2.3

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash Report
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Information

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I am using a Common Trades version intended for my Minecraft version.
          required: true
        - label: I am using compatible versions of the required dependencies.
          required: true
        - label: I can reproduce this issue.
          required: true
